groups:
  - name: 33pol-usage-writer
    rules:
      - alert: GatewayUsageWriterQueueHigh
        expr: gateway_usage_writer_queue_depth > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Usage writer queue depth is high
          description: Billing usage persistence queue is backing up.

      - alert: GatewayUsageWriterDroppedEvents
        expr: increase(gateway_usage_writer_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Usage events dropped
          description: The gateway dropped usage events due to queue saturation.
