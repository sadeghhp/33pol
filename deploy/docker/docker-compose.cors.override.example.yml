# Deprecated: CORS from .env is applied automatically.
#
# Add origins to .env at the repo root (any number, no Compose edits):
#   GATEWAY_CORS_ALLOWED_ORIGIN_0=https://*.github.io
#   GATEWAY_CORS_ALLOWED_ORIGIN_1=http://localhost:5173
#   GATEWAY_CORS_ALLOWED_ORIGIN_2=http://localhost
#
# Or comma-separated:
#   GATEWAY_CORS_ALLOWED_ORIGINS=https://*.github.io,http://localhost:5173
#
# Then: docker compose up -d --force-recreate gateway
#
# The gateway service loads ../../.env via env_file in deploy/docker/docker-compose.yml.
# Do not copy this file unless you need other gateway overrides.
