global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Uncomment when alert rules exist under deploy/prometheus/alerts/
# rule_files:
#   - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Enable when running: docker compose --profile gateway up
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
