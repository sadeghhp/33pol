# 33pol local stack — gateway, Postgres, Prometheus, Grafana, mock upstream (WP5.4).
# Usage: repo root `docker compose up -d --build` or see deploy/docker/README.md
#
# Local-dev defaults below (POSTGRES_PASSWORD, GATEWAY_ADMIN_API_KEY, GATEWAY_KEY_PEPPER)
# let `docker compose up` work without a .env file. Override via .env for non-local deploys.
# Admin UI sign-in key (default): sk-33pol-4aa283ddb877adaccc60cb53314fa15cfd41f01084df064c

name: 33pol

services:
  mock-upstream:
    profiles: ["mock", "full"]
    image: wiremock/wiremock:3.9.1
    restart: unless-stopped
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "${MOCK_UPSTREAM_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/__admin/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mock-upstream:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      # Embedded SQLite database, persisted on the gateway-data volume mounted at /data.
      ConnectionStrings__GatewayDb: ${GATEWAY_DB_CONNECTION:-Data Source=/data/gateway.db}
      Gateway__ModelsConfigPath: /app/config/models.json
      Gateway__Bootstrap__AdminApiKey: ${GATEWAY_ADMIN_API_KEY:-sk-33pol-4aa283ddb877adaccc60cb53314fa15cfd41f01084df064c}
      # Production requires GATEWAY_KEY_PEPPER (>=16 chars, not dev-pepper-change-me). Development may omit it.
      Gateway__Security__KeyPepper: ${GATEWAY_KEY_PEPPER:-oJHJdzSvNdVFbFd8fDrexL3bf6n9ggW}
      Gateway__Bootstrap__KeyPepper: ${GATEWAY_KEY_PEPPER:-oJHJdzSvNdVFbFd8fDrexL3bf6n9ggW}
      Gateway__OperatorConsole__Enabled: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      Quota__DefaultMonthlyTokenLimit: ${QUOTA_MONTHLY_TOKEN_LIMIT:-10000000}
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT: "false"
    volumes:
      # Directory mount: atomic rename works; single-file bind mounts often return EBUSY on save.
      - ./config:/app/config
      # Persist the embedded SQLite database (gateway.db + WAL/SHM sidecars) across restarts.
      - gateway-data:/data
    ports:
      # Default to loopback only; set GATEWAY_BIND=0.0.0.0 explicitly to expose on the network.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  prometheus:
    profiles: ["observability", "full"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      gateway:
        condition: service_healthy

  grafana:
    profiles: ["observability", "full"]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  gateway-data:
  prometheus-data:
  grafana-data:
