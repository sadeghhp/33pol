replicaCount: 1

image:
  # Override repository if your GHCR org differs (default matches github.com/sadeghhp/33pol).
  repository: ghcr.io/sadeghhp/33pol
  tag: "2.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Example (SSE-friendly timeouts for streaming inference):
  # annotations:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

gateway:
  modelsConfigPath: /app/config/models.json
  operatorConsole:
    enabled: false
  # Browser SPA origins for Production (scheme + host + port, no trailing slash).
  cors:
    allowedOrigins: []
    # allowedOrigins:
    #   - https://app.example.com

# Optional upstream provider API keys for models.json upstreamAuth.envVar.
# Prefer Kubernetes Secrets via extraEnvFrom (do not commit secrets in values.yaml).
providerApiKeys:
  extraEnv: []
  # extraEnv:
  #   - name: OPENROUTER_API_KEY
  #     valueFrom:
  #       secretKeyRef:
  #         name: gateway-provider-keys
  #         key: openrouter
  extraEnvFrom: []
  # extraEnvFrom:
  #   - secretRef:
  #       name: gateway-provider-keys
  # Supported envVar names (ProviderCatalog): OPENROUTER_API_KEY, OPENAI_API_KEY,
  # TOGETHER_API_KEY, GROQ_API_KEY, DEEPSEEK_API_KEY, MISTRAL_API_KEY, FIREWORKS_API_KEY,
  # DASHSCOPE_API_KEY, plus any custom envVar for POST /admin/api/providers/models.

postgresql:
  enabled: false
  host: ""
  port: 5432
  database: gateway
  username: gateway
  existingSecret: ""
  secretKey: password

probes:
  livenessPath: /health/live
  readinessPath: /health/ready

terminationGracePeriodSeconds: 60
