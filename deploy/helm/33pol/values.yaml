# 33pol runs SINGLE-INSTANCE only. Its embedded SQLite database is one file on a ReadWriteOnce
# volume; a second writer corrupts it. replicaCount MUST stay 1 and autoscaling MUST stay disabled —
# the chart refuses to render otherwise (see templates/deployment.yaml). Scale vertically via resources.
replicaCount: 1

image:
  # Override repository if your GHCR org differs (default matches github.com/sadeghhp/33pol).
  repository: ghcr.io/sadeghhp/33pol
  tag: "2.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Example (SSE-friendly timeouts for streaming inference):
  # annotations:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Autoscaling is INCOMPATIBLE with the single-file SQLite backend and is rejected at render time.
# Do not enable it. These fields are retained only so the HPA template parses; leave enabled: false.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  # The ServiceMonitor sends the scrape token from gateway.existingSecret / gateway.metrics.scrapeTokenSecret
  # as a Bearer credential unless gateway.metrics.allowAnonymous is true (the Secret must live in the
  # ServiceMonitor's namespace).

gateway:
  # --- Required secrets ------------------------------------------------------------------------
  # The image runs as ASP.NET Core Production. GatewayBootstrapOptionsValidator refuses to start when
  # the key pepper is empty or weak, so the chart REQUIRES either an existing Secret or inline values
  # (it fails at render time otherwise). Prefer existingSecret; never commit inline secrets.
  #
  # existingSecret must carry these keys:
  #   keyPepper    -> Gateway__Security__KeyPepper AND Gateway__Bootstrap__KeyPepper (must be identical;
  #                   >= 32 chars, e.g. `openssl rand -base64 48`). Rotating it invalidates every stored
  #                   API key hash — keep it stable for the lifetime of the database.
  #   adminApiKey  -> Gateway__Bootstrap__AdminApiKey, seeded on FIRST boot only (the seeder is a no-op
  #                   once tenants exist). Use it to sign in to /admin and mint real keys.
  #   metricsScrapeToken (optional) -> Gateway__Metrics__ScrapeToken, see gateway.metrics below.
  #
  #   kubectl create secret generic 33pol-gateway   #     --from-literal=keyPepper="$(openssl rand -base64 48)"   #     --from-literal=adminApiKey="sk-33pol-$(openssl rand -hex 24)"
  existingSecret: ""
  # Inline fallback for dev/test clusters only (values end up in the release manifest).
  keyPepper: ""
  adminApiKey: ""
  # /metrics is protected: callers need an Operator/Admin key or the scrape token
  # (`Authorization: Bearer <token>`), unless allowAnonymous is true. When existingSecret carries a
  # metricsScrapeToken key it is wired automatically (set scrapeToken to use an inline value instead).
  metrics:
    allowAnonymous: false
    scrapeToken: ""
    # Set when existingSecret does NOT contain a metricsScrapeToken key but you still want to reference
    # a different secret/key for the scrape token.
    scrapeTokenSecret: ""
    scrapeTokenSecretKey: metricsScrapeToken
  # -------------------------------------------------------------------------------------------
  modelsConfigPath: /app/config/models.json
  operatorConsole:
    enabled: false
  # Seconds to keep serving after shutdown begins, while readiness already reports unhealthy, so
  # kube-proxy stops routing to this pod before Kestrel closes. Should be a few readiness-probe
  # intervals and must stay below terminationGracePeriodSeconds.
  shutdownDrainSeconds: 15
  # Browser SPA origins for Production (scheme + host + port, no trailing slash).
  cors:
    allowedOrigins: []
    # allowedOrigins:
    #   - https://app.example.com

# Optional upstream provider API keys for models.json upstreamAuth.envVar.
# Prefer Kubernetes Secrets via extraEnvFrom (do not commit secrets in values.yaml).
providerApiKeys:
  extraEnv: []
  # extraEnv:
  #   - name: OPENROUTER_API_KEY
  #     valueFrom:
  #       secretKeyRef:
  #         name: gateway-provider-keys
  #         key: openrouter
  extraEnvFrom: []
  # extraEnvFrom:
  #   - secretRef:
  #       name: gateway-provider-keys
  # Supported envVar names (ProviderCatalog): OPENROUTER_API_KEY, OPENAI_API_KEY,
  # TOGETHER_API_KEY, GROQ_API_KEY, DEEPSEEK_API_KEY, MISTRAL_API_KEY, FIREWORKS_API_KEY,
  # DASHSCOPE_API_KEY, plus any custom envVar for POST /admin/api/providers/models.

# Embedded SQLite database. The gateway runs single-instance (keep replicaCount: 1); the database
# is a single file on a ReadWriteOnce volume. Disable persistence only for ephemeral/test installs.
persistence:
  enabled: true
  mountPath: /data
  connectionString: "Data Source=/data/gateway.db"
  # Encrypted upstream provider secrets and the admin audit trail. Both MUST live on a writable
  # volume: the image defaults (config/*.enc, config/*.jsonl under /app) are unwritable once
  # securityContext.readOnlyRootFilesystem is on, which would make model provisioning with an inline
  # API key fail and silently disable audit logging.
  upstreamSecretsPath: /data/upstream-secrets.enc
  auditLogPath: /data/audit-log.jsonl
  size: 1Gi
  accessMode: ReadWriteOnce
  # storageClass: ""   # unset uses the cluster default StorageClass

probes:
  livenessPath: /health/live
  readinessPath: /health/ready
  # startupProbe gives the first boot (EF migrations, model catalog load) up to
  # failureThreshold * periodSeconds before liveness kicks in.
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 5

terminationGracePeriodSeconds: 60

# Hardened by default so the pod is admitted under the "restricted" Pod Security Standard. The image
# already runs as uid 1654 (APP_UID) and only writes to /data (persistence: database, upstream secrets,
# audit log) and /tmp (emptyDir below).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The pod never talks to the Kubernetes API.
automountServiceAccountToken: false
