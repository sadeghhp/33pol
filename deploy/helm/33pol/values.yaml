# 33pol runs SINGLE-INSTANCE only. Its embedded SQLite database is one file on a ReadWriteOnce
# volume; a second writer corrupts it. replicaCount MUST stay 1 and autoscaling MUST stay disabled —
# the chart refuses to render otherwise (see templates/deployment.yaml). Scale vertically via resources.
replicaCount: 1

image:
  # Override repository if your GHCR org differs (default matches github.com/sadeghhp/33pol).
  repository: ghcr.io/sadeghhp/33pol
  tag: "2.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Example (SSE-friendly timeouts for streaming inference):
  # annotations:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Autoscaling is INCOMPATIBLE with the single-file SQLite backend and is rejected at render time.
# Do not enable it. These fields are retained only so the HPA template parses; leave enabled: false.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

gateway:
  modelsConfigPath: /app/config/models.json
  operatorConsole:
    enabled: false
  # Browser SPA origins for Production (scheme + host + port, no trailing slash).
  cors:
    allowedOrigins: []
    # allowedOrigins:
    #   - https://app.example.com

# Optional upstream provider API keys for models.json upstreamAuth.envVar.
# Prefer Kubernetes Secrets via extraEnvFrom (do not commit secrets in values.yaml).
providerApiKeys:
  extraEnv: []
  # extraEnv:
  #   - name: OPENROUTER_API_KEY
  #     valueFrom:
  #       secretKeyRef:
  #         name: gateway-provider-keys
  #         key: openrouter
  extraEnvFrom: []
  # extraEnvFrom:
  #   - secretRef:
  #       name: gateway-provider-keys
  # Supported envVar names (ProviderCatalog): OPENROUTER_API_KEY, OPENAI_API_KEY,
  # TOGETHER_API_KEY, GROQ_API_KEY, DEEPSEEK_API_KEY, MISTRAL_API_KEY, FIREWORKS_API_KEY,
  # DASHSCOPE_API_KEY, plus any custom envVar for POST /admin/api/providers/models.

# Embedded SQLite database. The gateway runs single-instance (keep replicaCount: 1); the database
# is a single file on a ReadWriteOnce volume. Disable persistence only for ephemeral/test installs.
persistence:
  enabled: true
  mountPath: /data
  connectionString: "Data Source=/data/gateway.db"
  size: 1Gi
  accessMode: ReadWriteOnce
  # storageClass: ""   # unset uses the cluster default StorageClass

probes:
  livenessPath: /health/live
  readinessPath: /health/ready

terminationGracePeriodSeconds: 60
