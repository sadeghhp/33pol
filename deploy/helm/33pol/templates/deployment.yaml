{{- /*
  Single-instance guardrail. The gateway persists all state in one SQLite file on a ReadWriteOnce
  volume; a second writer corrupts it. Reject any configuration that would run more than one replica.
*/ -}}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "33pol runs single-instance only: replicaCount must be 1. Its embedded SQLite database is a single file on a ReadWriteOnce volume and a second writer corrupts it. Scale up vertically (resources), not horizontally." }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- fail "33pol runs single-instance only: autoscaling.enabled must be false. Horizontal scaling would run multiple writers against one embedded SQLite file and corrupt it." }}
{{- end }}
{{- /*
  Secrets guardrail. The image runs as Production, where GatewayBootstrapOptionsValidator refuses to
  start without a strong key pepper; without a bootstrap admin key nobody can sign in to /admin.
*/ -}}
{{- if and (not .Values.gateway.existingSecret) (or (not .Values.gateway.keyPepper) (not .Values.gateway.adminApiKey)) }}
{{- fail "33pol requires a key pepper and a bootstrap admin key: set gateway.existingSecret (Secret with keys keyPepper + adminApiKey) or, for dev/test only, gateway.keyPepper and gateway.adminApiKey inline. See values.yaml." }}
{{- end }}
{{- $secret := .Values.gateway.existingSecret }}
{{- $metricsSecret := .Values.gateway.metrics.scrapeTokenSecret }}
{{- $metricsSecretKey := .Values.gateway.metrics.scrapeTokenSecretKey | default "metricsScrapeToken" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "33pol.fullname" . }}
  labels:
    {{- include "33pol.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # SQLite is a single file on a ReadWriteOnce volume; Recreate avoids two pods mounting it at once.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "33pol.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "33pol.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            {{- if $secret }}
            # One pepper feeds both options; they must be identical or bootstrap-seeded keys never
            # authenticate.
            - name: Gateway__Security__KeyPepper
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: keyPepper
            - name: Gateway__Bootstrap__KeyPepper
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: keyPepper
            - name: Gateway__Bootstrap__AdminApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: adminApiKey
            {{- else }}
            - name: Gateway__Security__KeyPepper
              value: {{ .Values.gateway.keyPepper | quote }}
            - name: Gateway__Bootstrap__KeyPepper
              value: {{ .Values.gateway.keyPepper | quote }}
            - name: Gateway__Bootstrap__AdminApiKey
              value: {{ .Values.gateway.adminApiKey | quote }}
            {{- end }}
            - name: Gateway__Metrics__AllowAnonymous
              value: {{ .Values.gateway.metrics.allowAnonymous | quote }}
            {{- if .Values.gateway.metrics.scrapeToken }}
            - name: Gateway__Metrics__ScrapeToken
              value: {{ .Values.gateway.metrics.scrapeToken | quote }}
            {{- else if or $metricsSecret $secret }}
            - name: Gateway__Metrics__ScrapeToken
              valueFrom:
                secretKeyRef:
                  name: {{ ($metricsSecret | default $secret) | quote }}
                  key: {{ $metricsSecretKey | quote }}
                  # Absent key => no token; /metrics then needs an operator key (or allowAnonymous).
                  optional: true
            {{- end }}
            - name: Gateway__ModelsConfigPath
              value: {{ .Values.gateway.modelsConfigPath | quote }}
            - name: Gateway__OperatorConsole__Enabled
              value: {{ .Values.gateway.operatorConsole.enabled | quote }}
            # Keeps serving after readiness flips to unhealthy, so the Service endpoint controller
            # removes this pod before Kestrel stops accepting. Without it both happen at the same
            # instant and every rolling restart drops in-flight requests.
            - name: Gateway__Resilience__ShutdownDrainSeconds
              value: {{ .Values.gateway.shutdownDrainSeconds | quote }}
            {{- range $index, $origin := .Values.gateway.cors.allowedOrigins }}
            - name: Gateway__Cors__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
            - name: ConnectionStrings__GatewayDb
              value: {{ .Values.persistence.connectionString | quote }}
            # The app's defaults for these two files are relative to /app, which is read-only under
            # securityContext.readOnlyRootFilesystem; keep them on the writable data volume.
            - name: Gateway__UpstreamSecretsPath
              value: {{ .Values.persistence.upstreamSecretsPath | quote }}
            - name: Gateway__Security__AuditLogPath
              value: {{ .Values.persistence.auditLogPath | quote }}
            {{- with .Values.providerApiKeys.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.providerApiKeys.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            # Writable scratch space: the root filesystem is read-only (securityContext) and .NET
            # needs a writable TMPDIR.
            - name: tmp
              mountPath: /tmp
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "33pol.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
