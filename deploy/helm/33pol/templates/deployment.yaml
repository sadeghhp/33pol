apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "33pol.fullname" . }}
  labels:
    {{- include "33pol.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # SQLite is a single file on a ReadWriteOnce volume; Recreate avoids two pods mounting it at once.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "33pol.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "33pol.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Gateway__ModelsConfigPath
              value: {{ .Values.gateway.modelsConfigPath | quote }}
            - name: Gateway__OperatorConsole__Enabled
              value: {{ .Values.gateway.operatorConsole.enabled | quote }}
            {{- range $index, $origin := .Values.gateway.cors.allowedOrigins }}
            - name: Gateway__Cors__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
            - name: ConnectionStrings__GatewayDb
              value: {{ .Values.persistence.connectionString | quote }}
            {{- with .Values.providerApiKeys.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.providerApiKeys.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "33pol.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
