{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "33pol.fullname" . }}
  labels:
    {{- include "33pol.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "33pol.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      {{- $tokenSecret := .Values.gateway.metrics.scrapeTokenSecret | default .Values.gateway.existingSecret }}
      {{- if and (not .Values.gateway.metrics.allowAnonymous) $tokenSecret }}
      # /metrics requires the scrape token (or an operator key) unless gateway.metrics.allowAnonymous.
      authorization:
        type: Bearer
        credentials:
          name: {{ $tokenSecret | quote }}
          key: {{ .Values.gateway.metrics.scrapeTokenSecretKey | default "metricsScrapeToken" | quote }}
      {{- end }}
{{- end }}
