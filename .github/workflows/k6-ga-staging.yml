name: k6 GA (staging)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging gateway base URL (e.g. https://gateway.staging.example)
        required: true
      model:
        description: Model id in registry
        required: true
        default: gpt-local
      # The inference API key is NOT an input: workflow_dispatch inputs are recorded in run metadata
      # and visible to anyone with read access. Store it as the repository/environment secret
      # STAGING_INFERENCE_API_KEY instead (optional; rate-limit storm may need a dedicated key).

permissions:
  contents: read

jobs:
  ga-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Health check
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: curl -sf "$BASE_URL/health/live"

      - name: inference-rps.js
        env:
          BASE_URL: ${{ inputs.base_url }}
          MODEL: ${{ inputs.model }}
          API_KEY: ${{ secrets.STAGING_INFERENCE_API_KEY }}
        run: k6 run perf/k6/scripts/inference-rps.js

      - name: streaming-concurrent.js
        env:
          BASE_URL: ${{ inputs.base_url }}
          MODEL: ${{ inputs.model }}
          API_KEY: ${{ secrets.STAGING_INFERENCE_API_KEY }}
          STREAM_VUS: "50"
        run: k6 run perf/k6/scripts/streaming-concurrent.js

      - name: rate-limit-storm.js
        env:
          BASE_URL: ${{ inputs.base_url }}
          MODEL: ${{ inputs.model }}
          API_KEY: ${{ secrets.STAGING_INFERENCE_API_KEY }}
        run: k6 run perf/k6/scripts/rate-limit-storm.js
