# Reusable build + test gate (Release). Called from ci.yml and release.yml.
name: CI reusable

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/33pol.Admin.Web/package-lock.json

      - name: Setup .NET (gateway E2E)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Admin frontend — install, typecheck, test, build, e2e
        working-directory: src/33pol.Admin.Web
        env:
          ADMIN_E2E_PORT: "5050"
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          node ../../scripts/check-rate-limit-help.mjs
          node ../../build/check-admin-bundle-gates.mjs
          dotnet restore ../../33pol.sln
          npx playwright install chromium --with-deps
          npm run test:e2e
          npm audit --audit-level=high

      - name: Admin perf gates (M17 baseline)
        run: node build/check-admin-perf-gates.mjs

  build-test:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js (frontend assets for dotnet build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/33pol.Admin.Web/package-lock.json

      - name: Build admin frontend
        working-directory: src/33pol.Admin.Web
        run: npm ci --ignore-scripts && npm run build

      - name: Verify admin assets exist
        run: node build/check-admin-assets.mjs

      - name: Admin bundle and help gates
        run: |
          node scripts/check-rate-limit-help.mjs
          node build/check-admin-bundle-gates.mjs

      - name: Restore
        run: dotnet restore 33pol.sln

      - name: Build
        run: dotnet build 33pol.sln -c Release --no-restore -p:SkipFrontendBuild=true

      - name: Test with coverage
        run: >
          dotnet test 33pol.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Coverage threshold
        run: bash build/check-coverage.sh TestResults

      - name: Validate Prometheus alert rules
        # promtool is not preinstalled on ubuntu-latest; run it from the same Prometheus image the
        # compose stack uses so the rules are actually validated (no silent skip).
        run: |
          docker run --rm -v "${PWD}/deploy/prometheus/alerts:/alerts:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check rules /alerts/33pol.yml /alerts/33pol-writer.yml /alerts/33pol-scrape.yml

      - name: Test Prometheus alert rules
        # check rules only parses. These evaluate the expressions against synthetic series, which
        # is what catches a rule that is valid and can never fire.
        run: |
          docker run --rm -v "${PWD}/deploy/prometheus/alerts:/alerts:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 test rules /alerts/tests/33pol-rate-limit_test.yml \
              /alerts/tests/33pol-scrape_test.yml /alerts/tests/33pol-tenant-throttled_test.yml

      - name: Validate the Prometheus and Alertmanager configuration
        # The observability profile mounts these as they are, so a config that does not load is a
        # Prometheus that does not start, or one that fires alerts nobody receives.
        run: |
          docker run --rm -v "${PWD}/deploy/docker/config:/config:ro" \
            -v "${PWD}/deploy/prometheus/alerts:/etc/prometheus/alerts:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check config --syntax-only /config/prometheus.yml
          docker run --rm -v "${PWD}/deploy/docker/config:/config:ro" --entrypoint amtool \
            prom/alertmanager:v0.27.0 check-config /config/alertmanager.yml \
            /config/alertmanager.teams.yml.example

      - name: Test operator scripts
        run: python3 -m unittest discover -s tests/scripts -p "test_*.py"

      - name: Dependency vulnerability audit
        run: |
          dotnet list 33pol.sln package --vulnerable --include-transitive 2>&1 | tee vulnerability-audit.txt
          if grep -q "has the following vulnerable" vulnerability-audit.txt; then
            echo "::error::Vulnerable packages reported — see docs/security.md and vulnerability-audit.txt"
            exit 1
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-${{ github.run_id }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
