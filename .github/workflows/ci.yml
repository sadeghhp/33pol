name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore 33pol.sln

      - name: Build
        run: dotnet build 33pol.sln -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test 33pol.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DefaultSink.DataStore=CoverageReports

      - name: Phase 2 coverage gate (interim)
        shell: pwsh
        run: ./tools/verify-phase2-coverage.ps1 -ResultsDirectory ./TestResults

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
