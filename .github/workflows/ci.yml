name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/ci-reusable.yml

  install-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats

      - name: Shellcheck install scripts
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2034 -e SC2120 -e SC2119
        run: |
          shellcheck -S error scripts/install-33pol.sh scripts/install/install-33pol.sh scripts/install/lib/*.sh \
            scripts/host-health/ubuntu-healthcheck.sh scripts/host-health/lib/*.sh \
            perf/ci/verify-compose-health-gpu.sh perf/ci/verify-compose-health.sh

      - name: Bats install lib tests
        run: bats tests/install/

      - name: Bats host-health tests
        run: bats tests/host-health/

  k6-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore 33pol.sln

      - name: Build gateway
        run: dotnet build src/33pol.App/33pol.App.csproj -c Release

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke
        env:
          SMOKE_DURATION: 30s
        run: bash perf/ci/run-smoke.sh
